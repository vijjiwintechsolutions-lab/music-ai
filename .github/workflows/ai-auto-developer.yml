name: AI Auto Developer

on:
  push:
    branches:
      - market-ai/full-platform-execution
      - main
  workflow_dispatch:

permissions:
  contents: write
  checks: read
  deployments: read

concurrency:
  group: ai-auto-developer-${{ github.ref }}
  cancel-in-progress: false

env:
  AI_REPAIR_ATTEMPTS: "20"
  OPENAI_MODEL: gpt-4.1

jobs:
  autonomous-execution:
    name: Autonomous Build / Repair / Verify
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm install --legacy-peer-deps

      - name: Verify OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY"
          echo "OPENAI_API_KEY=present"

      - name: Autonomous project execution
        working-directory: web
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ env.OPENAI_MODEL }}
          AI_REPAIR_ATTEMPTS: ${{ env.AI_REPAIR_ATTEMPTS }}
        run: node scripts/ai-repair.mjs

      - name: Final production build verification
        working-directory: web
        run: npm run build

      - name: Report completion
        run: |
          echo "AUTONOMOUS_EXECUTION=PASS"
          echo "Build, repair and bounded tool implementation cycles completed."
