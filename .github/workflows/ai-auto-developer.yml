name: AI Auto Developer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  checks: read
  deployments: read

jobs:
  automation-smoke-test:
    name: Automation Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository
        run: |
          echo "GitHub Actions runner is working."
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          test -f web/package.json
          test -f web/next.config.* || true

      - name: Install dependencies
        working-directory: web
        run: npm install --legacy-peer-deps

      - name: Run production build
        working-directory: web
        run: npm run build

      - name: Verify automation secret exists
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY"
          echo "OPENAI_API_KEY is configured."

      - name: Automation smoke test passed
        run: |
          echo "AUTOMATION_SMOKE_TEST=PASS"
          echo "GitHub Actions can execute the repository build."
          echo "Next phase: enable the bounded AI repair loop only after this workflow is confirmed green."
